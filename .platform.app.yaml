name: "ll_project"
type: "python:3.13"

relationships:
  database: "db:postgresql"

#конфигурация приложения при его публикации в интернете
web:
  upstream:
    socket_family: unix
  commands:
    start: "gunicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application"
  locations:
    "/":
      passthru: true
    "/static":
      root: "static"
      expires: 1h
      allow: true
#размер постоянного диска приложения
disk: 512

#установка локального монтирования для чтения и записи журналов.
mounts:
  "logs":
    source: local
    source_path: logs

#хуки выполняемые в различные моменты жизненного цикла приложения.
hooks:
  build: |
    pip install --upgrade pip
    pip install -r requirements.txt
    pip install -r requirements_remote.txt
    
    mkdir logs
    python manage.py collectstatic
    rm -rf logs

deploy:
  python manage.py migrate